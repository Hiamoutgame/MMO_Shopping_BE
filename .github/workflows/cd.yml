name: CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Serialize releases so an older deployment cannot overtake a newer one.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/ci.yml

  verify-e2e:
    name: Verify API flows
    uses: ./.github/workflows/e2e.yml

  publish:
    name: Build & push image
    needs: [verify, verify-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Published image summary
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '### Published image\n\n%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy-render:
    name: Trigger Render deploy (optional)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    if: github.ref == 'refs/heads/main'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Deploy verified commit
        run: |
          set -euo pipefail
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo '::notice::RENDER_DEPLOY_HOOK_URL is unset; skipping Render.'
            exit 0
          fi
          separator='?'
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *\?* ]]; then separator='&'; fi
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 60 \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${GITHUB_SHA}"
          printf '### Render\n\nDeploy requested for commit %s. Check Render for completion.\n' \
            "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy-ssh:
    name: Deploy over SSH (optional)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Check SSH configuration
        id: check
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST$DEPLOY_USER$DEPLOY_SSH_KEY$DEPLOY_PATH$DEPLOY_KNOWN_HOSTS" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::SSH deployment is unset; skipping.'
            exit 0
          fi
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!key}" ]; then echo "::error::Missing $key"; exit 1; fi
          done
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          echo 'configured=true' >> "$GITHUB_OUTPUT"
      - name: Deploy immutable image and wait for health
        if: steps.check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          # The server already contains .env and a GHCR read-only login.
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
          printf -v remote_command 'bash -s -- %q %q' "$DEPLOY_PATH" "$IMAGE_REF"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          test -f .env
          export APP_IMAGE="$2"
          docker compose pull app db
          if ! docker compose up -d --no-build --wait --wait-timeout 180 app; then
            docker compose logs --tail 100 app db
            exit 1
          fi
          docker compose ps
          REMOTE
