# =============================================================================
# MMO Shopping - Nginx production (HTTPS, self-contained)
#
# Dùng khi xin chứng chỉ bằng webroot:
#   sudo certbot certonly --webroot -w /var/www/certbot \
#     -d mmo-shopping.vn -d www.mmo-shopping.vn
#   sudo cp deploy/nginx/mmo-shopping.conf /etc/nginx/sites-available/mmo-shopping.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Nếu chưa có chứng chỉ, dùng mmo-shopping.http.conf trước rồi chạy
# certbot --nginx (cách này đơn giản hơn).
#
# Thay mmo-shopping.vn bằng tên miền thật (server_name + đường dẫn cert).
# =============================================================================

# upstream giữ kết nối tới Node (keepalive) để giảm độ trễ
upstream mmo_shopping_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- HTTP: chỉ phục vụ ACME và chuyển hướng sang HTTPS -----------------------
server {
    listen 80;
    listen [::]:80;
    server_name mmo-shopping.vn www.mmo-shopping.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mmo-shopping.vn www.mmo-shopping.vn;

    ssl_certificate     /etc/letsencrypt/live/mmo-shopping.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mmo-shopping.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: chỉ bỏ comment sau khi HTTPS chạy ổn và certbot renew --dry-run OK.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    root /var/www/mmo-shopping;
    index index.html;

    client_max_body_size 20m;

    # gzip cho text/JS/CSS/JSON
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- API -> NestJS (container, cổng 3000) -----------------------------
    location /api/ {
        proxy_pass http://mmo_shopping_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- assets có hash: cache 1 năm --------------------------------------
    location /assets/ {
        # Một header Cache-Control duy nhất (không dùng "expires" để tránh trùng header)
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- SPA fallback -----------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
