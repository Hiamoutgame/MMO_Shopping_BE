# =============================================================================
# MMO Shopping - Nginx bootstrap (HTTP only)
#
# Dùng cho bước đầu, TRƯỚC khi có chứng chỉ TLS. Sau khi chạy:
#   sudo certbot --nginx -d mmo-shopping.vn -d www.mmo-shopping.vn
# certbot sẽ tự thêm khối listen 443 + redirect HTTPS vào file này.
#
# Cài đặt:
#   sudo cp deploy/nginx/mmo-shopping.http.conf /etc/nginx/sites-available/mmo-shopping.conf
#   sudo ln -sfn /etc/nginx/sites-available/mmo-shopping.conf /etc/nginx/sites-enabled/mmo-shopping.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Nhớ thay mmo-shopping.vn bằng tên miền thật.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name mmo-shopping.vn www.mmo-shopping.vn;

    # Thư mục chứa bản build của MMO_Shopping_FE (npm run build -> dist/)
    root /var/www/mmo-shopping;
    index index.html;

    client_max_body_size 20m;

    # --- ACME challenge (certbot webroot) ---------------------------------
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # --- API -> NestJS trong Docker (docker-compose.yml, APP_PORT=3000) ---
    # proxy_pass KHÔNG có dấu "/" ở cuối để giữ nguyên đường dẫn /api/...
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Static assets có hash trong tên: cache dài hạn --------------------
    location /assets/ {
        # Một header Cache-Control duy nhất (không dùng "expires" để tránh trùng header)
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- SPA fallback: mọi route do React Router xử lý --------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html không cache để bản deploy mới có hiệu lực ngay
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
