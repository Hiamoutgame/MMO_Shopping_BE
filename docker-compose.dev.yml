# Development stack: backend with hot reload + PostgreSQL.
# Usage:  docker compose -f docker-compose.dev.yml up -d --build
name: mmo-shopping-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mmo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mmo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mmo_shopping}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data-dev:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-mmo} -d ${POSTGRES_DB:-mmo_shopping}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: mmo-shopping-be:dev
    init: true
    restart: unless-stopped
    command: npm run start:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: '3000'
      DB_HOST: db
      DB_PORT: '5432'
      DB_USERNAME: ${POSTGRES_USER:-mmo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mmo_dev_password}
      DB_DATABASE: ${POSTGRES_DB:-mmo_shopping}
      DB_SSL: 'false'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-7}
      INVENTORY_ENCRYPTION_KEY: ${INVENTORY_ENCRYPTION_KEY:-dev-inventory-key}
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:-dev-payment-secret}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-dev-integration-key}
      HOANPHI_API_BASE_URL: ${HOANPHI_API_BASE_URL:-https://hoanphi247.vn/api/v1/openapi}
      HOANPHI_TIMEOUT_MS: ${HOANPHI_TIMEOUT_MS:-10000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SWAGGER_PATH: ${SWAGGER_PATH:-api/docs}
      SWAGGER_TITLE: ${SWAGGER_TITLE:-MMO Shopping API (dev)}
      SWAGGER_DESCRIPTION: ${SWAGGER_DESCRIPTION:-MMO Shopping Backend API}
      SWAGGER_VERSION: ${SWAGGER_VERSION:-1.0.0}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED_ADMIN: ${RUN_SEED_ADMIN:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      # Hot reload: source is mounted over the image copy.
      - ./src:/app/src
      - ./tests:/app/tests
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
      - ./nest-cli.json:/app/nest-cli.json:ro

volumes:
  db-data-dev:
